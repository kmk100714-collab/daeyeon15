    // Firebase Config Check & Fallback
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "demo-api-key",
          authDomain: "demo-app.firebaseapp.com",
          projectId: "demo-mcdonalds-kiosk",
          storageBucket: "demo-app.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:abcdef"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Global handles for React component usage
    window.mcdDb = db;
    window.mcdAuth = auth;
    window.mcdFirebaseHelpers = {
      signInAnonymously,
      signInWithCustomToken,
      collection,
      addDoc,
      onSnapshot,
      doc,
      deleteDoc,
      getDocs
    };
  </script>

            // 1. Authenticate
            let userCredential;
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              userCredential = await signInWithCustomToken(window.mcdAuth, __initial_auth_token);
            } else {
              userCredential = await signInAnonymously(window.mcdAuth);
            }

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'mcd-kiosk-group';
            // Path following mandatory rules for shared public data
            const ordersRef = collection(window.mcdDb, 'artifacts', appId, 'public', 'data', 'orders');

            // 2. Real-time Listener for Group Orders
            unsubscribe = onSnapshot(
              ordersRef,
              (snapshot) => {
                const ordersList = [];
                snapshot.forEach((docSnap) => {
                  ordersList.push({
                    docId: docSnap.id,
                    ...docSnap.data()
                  });
                });
                // Sort by timestamp descending
                ordersList.sort((a, b) => b.timestamp - a.timestamp);
                setSubmittedOrders(ordersList);
              },
              (error) => {
                console.error("Firestore sync error:", error);
              }
            );
          } catch (err) {
            console.error("Firebase init error:", err);
          }
        };

        initFirebaseSync();

        return () => {
          if (unsubscribe) unsubscribe();
        };
      }, []);

          window.lucide.createIcons();

      // Save student profile

        return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            timestamp: Date.now(),
            createdAt: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })

          await addDoc(ordersRef, newOrder);

          setCart([]);
          setIsHostModalOpen(false);
          setOrderSubmittedSuccess(true);
          setTimeout(() => setOrderSubmittedSuccess(false), 3500);

          console.error("Order submission failed:", err);

        try {
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'mcd-kiosk-group';
          const { collection, getDocs, doc, deleteDoc } = window.mcdFirebaseHelpers;
          const ordersRef = collection(window.mcdDb, 'artifacts', appId, 'public', 'data', 'orders');
          
          const snapshot = await getDocs(ordersRef);
          const deletePromises = snapshot.docs.map(docSnap => 
            deleteDoc(doc(window.mcdDb, 'artifacts', appId, 'public', 'data', 'orders', docSnap.id))
          );
          await Promise.all(deletePromises);

          qty: 1,

          const existingIdx = prev.findIndex(ci =>

          );

            copy[existingIdx].qty += 1;
            return copy;
          }
          return [...prev, cartEntry];

        setSelectedItem(null);

          return prev.map(item => {
            if (item.id === id) {
              const newQty = item.qty + delta;
              return newQty > 0 ? { ...item, qty: newQty } : null;

                  <div className="bg-amber-50 border border-amber-200 p-3 rounded-2xl text-xs space-y-1">
                    <p className="font-bold text-amber-900">주문자 정보</p>
                    <p className="text-gray-700">• 학번/이름: <strong>{studentId || '학번미입력'} {studentName || '이름미입력'}</strong></p>
                    <p className="text-gray-700">• 식사 형태: <strong>{diningType === 'eatIn' ? '매장 식사' : '포장'}</strong></p>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">
                      추가 요청 사항 (피클 제외, 얼음 빼기 등)
                    </label>
                    <input
                      type="text"
                      placeholder="요청사항이 있다면 작성해주세요"
                      value={customerNote}
                      onChange={(e) => setCustomerNote(e.target.value)}
                      className="w-full text-xs p-2.5 border border-gray-300 rounded-xl focus:outline-none focus:border-mcdRed"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">
                      주문서 미리보기
                    </label>
                    <textarea
                      readOnly
                      rows="6"
                      value={formattedOrderText}
                      className="w-full text-[11px] font-mono bg-gray-50 border border-gray-200 p-2.5 rounded-xl text-gray-800 leading-relaxed focus:outline-none"
                    ></textarea>
                  </div>
                </div>

                {/* Actions */}
                <div className="p-4 bg-gray-50 border-t border-gray-100 flex flex-col gap-2">
                  <button
                    onClick={handleSendOrderToGroupPool}
                    disabled={isSubmitting}
                    className="w-full py-3.5 bg-mcdRed hover:bg-red-700 text-white font-extrabold text-sm rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 disabled:opacity-50"
                  >
                    <span>{isSubmitting ? '전송 중...' : '🚀 호스트에게 주문서 실시간 제출하기'}</span>
                  </button>

                  <div className="flex gap-2">
                    <button
                      onClick={handleCopyHostText}
                      className={`flex-1 py-2.5 px-3 rounded-xl font-bold text-xs transition-all flex items-center justify-center gap-1 border ${
                        copiedText
                          ? 'bg-green-600 text-white border-green-600'
                          : 'bg-mcdYellow hover:bg-mcdYellowHover text-mcdDark border-amber-300'
                      }`}
                    >
                      <span>{copiedText ? '✓ 텍스트 복사완료' : '📋 텍스트 복사'}</span>
                    </button>

                    <button
                      onClick={() => {
                        if (navigator.share) {
                          navigator.share({
                            title: '맥도날드 주문서',
                            text: formattedOrderText
                          }).catch(() => {});
                        } else {
                          handleCopyHostText();
                        }
                      }}
                      className="py-2.5 px-4 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold text-xs rounded-xl transition-all"
                    >
                      카톡/공유
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
